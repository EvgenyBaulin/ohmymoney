# The core must keep building without Apple frameworks: this job is the portability check
# that stands in for a Windows runner until one exists. It builds AppCore only — the
# storage layer needs GRDB and SQLite and is not part of the promise. Two compilers: the
# oldest the manifest allows and the one the app is built with.
name: Core on Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: core-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.1", "6.4"]
    container: swift:${{ matrix.swift }}
    # A stuck build or test ends here, not after GitHub's six hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Build and test AppCore
        run: swift test --package-path Packages/AppCore
