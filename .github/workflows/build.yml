# Builds the macOS application and looks inside its App Store configuration — and no more.
#
# Everything else is checked on the author's Mac before a push, by `make verify` (`make
# verify-full` before a release): the tests of the packages and of the app, a build from scratch
# with every warning of our code an error, the tests once more in one copy of the host as this
# runner used to run them, and every static check. A run of the whole on this runner took an hour
# and a half to two hours, and a minute of macOS here will cost ten once the repository is
# private; what it found, the Mac now finds first (scripts/check-ci.sh, the rule of the minimum).
# This job is the one look from a clean machine with the same compiler: the tree builds from a
# fresh checkout, and the store bundle carries no updater.
#
# The interface is built on the Liquid Glass APIs of macOS 26, and the app is developed with
# Xcode 27 on macOS 27. GitHub's `macos-26` image carries Xcode 26.6 with the macOS 26.5 SDK,
# an older compiler that refuses code Xcode 27 accepts, so the job runs on the `xcode-27` label
# (macOS 27, Xcode 27) — the same compiler as the author's Mac. The step «Show the Xcode in use»
# stops the run at once when the label ever hands out another Xcode.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the run of the older one pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: xcode-27
    # On the runner the Debug build takes about six minutes and the store configuration, built
    # with optimisation for both architectures, about twenty-five (01.11) and over thirty (13.11,
    # when the alarm of a build at half an hour cut it off); one not done in 90 minutes is stuck.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Show the Xcode in use
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep macosx
          xcodebuild -version | grep -q '^Xcode 27\.' || {
            echo "::error::this job builds with Xcode 27; the runner has another"; exit 1; }

      # One release of XcodeGen, built from its source checked against a checksum: the project
      # is generated the same way every day, not by the day's Homebrew formula.
      - name: Install XcodeGen
        id: prepared
        run: scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"

      # The Debug build of the app (REUSE_BUILD=1: the runner starts from nothing anyway, so the
      # folder of scripts/fresh-build.sh would only be one more copy). XCB_OFFLINE is emptied:
      # the runner has no cache of packages, and xcodebuild fetches GRDB and Sparkle here.
      - name: Build the application
        run: make build REUSE_BUILD=1 XCB_OFFLINE=

      # Not only built: looked into. No Sparkle, no XPC services, no feed address in the store
      # bundle, and the id that ships. It runs even after the build above failed, so a red run
      # names both.
      - name: Build the App Store configuration and look inside it
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: make check-appstore-clean REUSE_BUILD=1 XCB_OFFLINE= XCB_TIME=4200

      # What the builds wrote, for the run that failed.
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs
          path: ~/Library/Developer/OhMyMoney/logs
          if-no-files-found: ignore
